     /*Transformando link em botão com estilos*/

    a:link, a:visited {
        background-color: crimson;
        color: bisque;
        text-decoration: none;
        padding: 15px 25px;
        display: inline-block;
        border: 4px solid #000;
    }

    a:hover, a:active {
        background-color: bisque;
        color:#000;
        border: 4px solid crimson;
        transition: .3s;
    }

    a:active {
        box-shadow: insert 0 0 2px 0 #0000
    }

    </style>
   </head>
    <body>

        <h1> mudando os estilos do links</h1>

        <a href="###">isso é um link</a>

        <hr>

        <h3> Definindo estilo de botão em um link</h3>

        <a href="###">link</a>
