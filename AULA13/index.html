<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula13 - HTML</title>

    <style>
        .importante{
            color: red;
            font-weight: bold;
            font-size: 150%;
        }
        .cidades{
            background-color: purple;
            border: 6px solid darkorchid;
            color: ghostwhite;
            padding: 10px;
        }

        .centralizado{
            text-align: center; 
        }
        .estilo{
            background-color: navy;
            color: aliceblue;
            padding: 10px;
            border: 4px solid goldenrod;
        }
    </style>
  </head>
  <body>
    
    <h1>Class em HTML</h1>

    <h2>Titulo <spam class="importante">importante</spam>spam no HTML</h2>
    <p> exemplo de conteudo <spam class="importante">importante</spam> no HTML</p>


    <hr>

    <h3>Definindo mais de uma classe para elementos</h3>

    <h2 class="cidades centralizado">São Paulo</h2>
    <h2 class="cidades">Rio de Janeiro</h2>
    <h2 class="cidades">Natal</h2>
    
    <hr>

    <h3>Mesma classes em diferentes elementos</h3>

    <h2 class="estilo">>Eu sou um h2</h2>
    <p class="estilo"></h>Eu sou um paragrafo</p>

    <hr>

    


  </body>
</html>
