<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula - HTML</title>
  </head>
  <body>
    
    <h1>Definindo listass no HTML</h1>

    <h3>Exemplo de lista não ordenada</h3>

    <ul>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
       
    </ul>

    <h3>Exemplo de lista ordenada</h3>


    <ol>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        
    </ol>



  </body>
 </html>
