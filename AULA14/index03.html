<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula14 - HTML</title>
  </head>
  <body>
    
    <h1>JavaScript no HTML</h1>

    <h3>Alterando valores de atributos com o JavaScript</h3>


    <img id="img-elemento" src="apagada.gif" width="100" height="100">


    <br>

    <button onclick="controlarLampada(1)">Apagar lampadas</button>
    <button onclick="controlarLampada(0)">Apagar lampadas</button>
    <script>

      function controlarLampada(interruptor){
        var nomeImagem ;
      
        if (interruptor == 0){
          nomeImagem="apagada.gif";
        }else{
          nomeImagem="aceza.gif";
        }

        document.getElementById("img-elemento").src = nomeImagem;
      }

    </script>
  </body>
</html>
